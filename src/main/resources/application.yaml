spring:
    application:
        name: spring-boot-starter-kit
    mvc:
        problemdetails:
            enabled: true

application:
    name: Spring Boot Starter Kit
    version: 0.1.0

server:
    shutdown: graceful

management:
    endpoints:
        web:
            exposure:
                include: health,info

    endpoint:
        health:
            probes:
                enabled: true

    info:
        env:
            enabled: true

info:
    app:
        name: ${application.name}
        version: ${application.version}
